name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # not run in svc
    # services:
    #   myscaledb:
    #     image: myscale/myscaledb:1.8.0
    #     ports:
    #       - 8123:8123
    #       - 9000:9000
    #     env:
    #       CLICKHOUSE_DB: default
    #       CLICKHOUSE_USER: default
    #       CLICKHOUSE_PASSWORD: myscaledb
    #     options: >-
    #       --name myscaledb
    #       --health-cmd "clickhouse-client --query 'SELECT 1'"
    #       --health-interval 5s
    #       --health-timeout 10s
    #       --health-retries 10
    #       --health-start-period 10s
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vectordb
        options: >-
          --health-cmd "pg_isready -U postgres -d vectordb"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MyScaleDB
        run: |
          echo "<clickhouse><users><default><networks><ip>::/0</ip><ip>0.0.0.0/0</ip></networks></default></users></clickhouse>" > listen.xml
          docker run -itd --rm \
              --name myscaledb \
              -p 8123:8123 -p 9000:9000 \
              -e CLICKHOUSE_DB=default \
              -e CLICKHOUSE_USER=default \
              -e CLICKHOUSE_PASSWORD=myscaledb \
              -v $(pwd)/listen.xml:/etc/clickhouse-server/users.d/listen.xml \
              myscale/myscaledb:1.8.0

      - name: Verify services are ready
        run: |
          echo "Checking MyScaleDB..."
          curl -f http://localhost:8123/?query=SELECT%201 || (echo "MyScaleDB not responding" && exit 1)
          echo "MyScaleDB is ready!"
          
          echo "Checking PostgreSQL..."
          pg_isready -h localhost -U postgres -d vectordb || (echo "PostgreSQL not responding" && exit 1)
          echo "PostgreSQL is ready!"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install 3.13

      - name: Install Project
        run: uv sync --dev

      - name: Setup test databases
        env:
          PGPASSWORD: postgres
        run: |
          # Setup PostgreSQL with pgvector extension
          psql -h localhost -U postgres -d vectordb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        env:
          # MyScaleDB configuration
          MYSCALE_HOST: "localhost"
          MYSCALE_PORT: "8123"
          MYSCALE_USER: "default"
          MYSCALE_PASSWORD: "myscaledb"
          MYSCALE_SECURE: "false"
          MYSCALE_VERIFY: "false"
          # pgvector configuration
          PGVECTOR_ENABLED: "true"
          PGVECTOR_HOST: "localhost"
          PGVECTOR_PORT: "5432"
          PGVECTOR_USER: "postgres"
          PGVECTOR_PASSWORD: "postgres"
          PGVECTOR_DATABASE: "vectordb"
          PGVECTOR_SSLMODE: "disable"
          # chDB configuration
          CHDB_ENABLED: "true"
          CHDB_DATA_PATH: ":memory:"
        run: |
          uv run pytest tests -v

      - name: Lint with Ruff
        run: uv run ruff check .

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mcp-sqlvectordb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image import
        run: |
          docker run --rm mcp-sqlvectordb:test python -c "import mcp_server; print('✅ MCP SqlVectorDB Docker image works!')"

      - name: Test Docker image default command
        run: |
          timeout 10s docker run --rm \
            -e MYSCALE_HOST=localhost \
            -e MYSCALE_USER=default \
            -e MYSCALE_PASSWORD="" \
            mcp-sqlvectordb:test || [ $? = 124 ] && echo "✅ Docker container starts successfully"
