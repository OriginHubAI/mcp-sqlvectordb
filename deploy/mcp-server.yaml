apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: mcp-sqlvdb
data:
  # MyScaleDB configuration
  MYSCALE_ENABLED: "true"
  MYSCALE_HOST: "chi-mcp-sqlvdb-single-node-0-0-0.chi-mcp-sqlvdb-single-node-0-0.mcp-sqlvdb.svc.cluster.local"
  MYSCALE_USER: "default"
  MYSCALE_PASSWORD: "myscale#EDC"
  MYSCALE_PORT: "8123"
  MYSCALE_SECURE: "false"
  MYSCALE_VERIFY: "false"
  MYSCALE_DATABASE: "default"
  
  # PgVector configuration
  PGVECTOR_ENABLED: "false"
  PGVECTOR_HOST: "pgvector.mcp-system.svc.cluster.local"
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: "postgres"
  PGVECTOR_PASSWORD: "postgres"
  PGVECTOR_DATABASE: "vectordb"
  PGVECTOR_SSLMODE: "disable"
  
  # MCP server configuration
  MCP_SERVER_TRANSPORT: "http"
  MCP_BIND_HOST: "0.0.0.0"
  MCP_BIND_PORT: "4200"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp-sqlvdb
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
      - name: mcp-server
        image: origin-hub-ai-registry.cn-shanghai.cr.aliyuncs.com/component/mcp-sqlvectordb:0.0.4
        ports:
        - containerPort: 4200
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: mcp-server-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: mcp-sqlvdb
  labels:
    app: mcp-server
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: "internet"
spec:
  type: LoadBalancer
  ports:
  - port: 4200
    targetPort: 4200
    protocol: TCP
    name: http
  selector:
    app: mcp-server
