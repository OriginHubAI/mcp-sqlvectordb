apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp-sqlvdb
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
      - name: mcp-server
        image: origin-hub-ai-registry.cn-shanghai.cr.aliyuncs.com/component/mcp-sqlvectordb:0.0.6
        ports:
        - containerPort: 4200
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: mcp-server-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: mcp-sqlvdb
  labels:
    app: mcp-server
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: "internet"
spec:
  type: LoadBalancer
  ports:
  - port: 4200
    targetPort: 4200
    protocol: TCP
    name: http
  selector:
    app: mcp-server
