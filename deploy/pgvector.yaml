---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-config
  namespace: mcp-system
data:
  POSTGRES_DB: "vectordb"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-init-script
  namespace: mcp-system
data:
  init.sql: |
    -- Enable pgvector extension
    CREATE EXTENSION IF NOT EXISTS vector;

    -- Create a sample table with vector column
    CREATE TABLE IF NOT EXISTS items (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT,
        embedding vector(3),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert sample data
    INSERT INTO items (name, description, embedding) VALUES
        ('item1', 'First test item', '[1,2,3]'),
        ('item2', 'Second test item', '[4,5,6]'),
        ('item3', 'Third test item', '[7,8,9]'),
        ('item4', 'Fourth test item', '[1,1,1]'),
        ('item5', 'Fifth test item', '[2,2,2]');

    -- Create index for vector similarity search (HNSW)
    CREATE INDEX ON items USING hnsw (embedding vector_l2_ops);

    -- Create another example table with higher dimensional vectors
    CREATE TABLE IF NOT EXISTS documents (
        id SERIAL PRIMARY KEY,
        title TEXT NOT NULL,
        content TEXT,
        embedding vector(1536),  -- Common dimension for OpenAI embeddings
        metadata JSONB,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create index for documents
    CREATE INDEX ON documents USING hnsw (embedding vector_cosine_ops);

    -- Create a table for demonstrating different distance functions
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        category TEXT,
        embedding vector(128),
        price DECIMAL(10, 2),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes with different distance functions
    CREATE INDEX products_l2_idx ON products USING hnsw (embedding vector_l2_ops);
    CREATE INDEX products_cosine_idx ON products USING hnsw (embedding vector_cosine_ops);
    CREATE INDEX products_ip_idx ON products USING hnsw (embedding vector_ip_ops);

    -- Grant privileges
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO postgres;

    -- Display info
    SELECT 'pgvector extension installed successfully' as status;
    SELECT 'Sample tables created: items, documents, products' as info;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data-pvc
  namespace: mcp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: mcp-system
  labels:
    app: pgvector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
      - name: pgvector
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        envFrom:
        - configMapRef:
            name: pgvector-config
        args:
        - "postgres"
        - "-c"
        - "shared_preload_libraries=vector"
        - "-c"
        - "max_connections=100"
        - "-c"
        - "shared_buffers=256MB"
        - "-c"
        - "effective_cache_size=1GB"
        - "-c"
        - "maintenance_work_mem=512MB"
        - "-c"
        - "checkpoint_completion_target=0.9"
        - "-c"
        - "wal_buffers=16MB"
        - "-c"
        - "default_statistics_target=100"
        - "-c"
        - "random_page_cost=1.1"
        - "-c"
        - "effective_io_concurrency=200"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pgvector-data-pvc
      - name: init-script
        configMap:
          name: pgvector-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: mcp-system
  labels:
    app: pgvector
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: pgvector

